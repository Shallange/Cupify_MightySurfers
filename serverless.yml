# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${file(./local.yml):org}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: cupify-mighty-surfers

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./local.yml):role}

functions:

## Jag delade upp funktionerna för att undvika mergekonflikter eftersom vi alla kommer att göra funktioner.

## Matches - Stina
  deleteMatch:
      handler: functions/matches/deleteMatch/index.handler
      events:
          - httpApi:
                path: /tournaments/{id}/matches/{matchId}
                method: DELETE

## Matches - Jimmy



## Tournaments - Isaak
  createTournament:
      handler: functions/tournaments/index.createTournamentHandler
      events:
          - httpApi:
                path: /tournaments
                method: POST

  getTournaments:
      handler: functions/tournaments/index.getTournamentsHandler
      events:
          - httpApi:
                path: /tournaments
                method: GET

  getTournament:
      handler: functions/tournaments/index.getTournamentHandler
      events:
          - httpApi:
                path: /tournaments/{id}
                method: GET

  updateTournamentStatus:
      handler: functions/tournaments/index.updateTournamentStatusHandler
      events:
          - httpApi:
                path: /tournaments/{id}/status
                method: PATCH

  deleteTournament:
      handler: functions/tournaments/index.deleteTournamentHandler
      events:
          - httpApi:
                path: /tournaments/{id}
                method: DELETE



## Teams - Pinar





resources:
  Resources:
    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-tournaments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-teams
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE

    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-matches
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
