# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${file(./local.yml):org}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: cupify-mighty-surfers

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./local.yml):role}

functions:

## Jag delade upp funktionerna för att undvika mergekonflikter eftersom vi alla kommer att göra funktioner.

## Matches - Stina
  deleteMatch:
      handler: functions/matches/deleteMatch/index.handler
      events:
          - httpApi:
                path: /tournaments/{id}/matches/{matchId}
                method: DELETE

  registerResult:
      handler: functions/matches/registerResult/index.handler
      events:
          - httpApi:
                path: /tournaments/{id}/matches/{matchId}/result
                method: PATCH

## Matches - Jimmy
  createMatch:
    handler: functions/matches/createMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: POST

  updateMatch:
    handler: functions/matches/updateMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: PUT

  getMatch:
    handler: functions/matches/getMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: GET
  getMatches:
    handler: functions/matches/getMatches/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: GET


## Tournaments - Isaak




 ## Teams - Pinar
  getTeams:
    handler: functions/teams/getTeams/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: GET

  getTeam:
    handler: functions/teams/getTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: GET

  createTeam:
    handler: functions/teams/createTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: POST
 

  updateTeam:
    handler: functions/teams/updateTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: PUT
   
  deleteTeam:
    handler: functions/teams/deleteTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: DELETE

resources:
  Resources:
    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-tournaments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-teams
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE

    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cupify-matches
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
