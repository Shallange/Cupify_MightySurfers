# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${file(./local.yml):org}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: cupify-mighty-surfers

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  stage: ${file(./local.yml):stage}
  profile: ${file(./local.yml):profile}

functions:
  hello:
    handler: functions/hello/index.handler
    events:
      - httpApi:
          path: /
          method: get
